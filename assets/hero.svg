  <g transform="translate(600 205)" fill="#075dff" filter="url(#glow)">
    <path d="M-170 0C-112-45-52-80 0-35C52-80 112-45 170 0C104-14 50-11 0 0C-50-11-104-14-170 0Z"/>
    <path d="M-170 13C-105 30-50 21 0 16C50 21 105 30 170 13C114 80 54 96 0 96C-54 96-114 80-170 13Z"/>
  </g>
  <text x="600" y="350" text-anchor="middle" fill="#dce8ff" font-family="ui-monospace,monospace" font-size="30" font-weight="700">MUSCLE-AWARE ARTICULATION IR</text>
  <text x="600" y="382" text-anchor="middle" fill="#79a6f7" font-family="ui-monospace,monospace" font-size="17">causal · append-only · measurable · hardware-constrained</text>
