<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bibliothecary">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/speaker-icon-180.png">
<title>Bibliothecary · tonight</title>
<style>
/* one phone on its own: the article above, the voice, microphone and mouth below */
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#page{display:flex;flex-direction:column;height:100%;height:100dvh}
iframe{border:0;display:block;width:100%}
#text{flex:1 1 auto;background:#fff}
#voice{flex:0 0 34%;min-height:190px}
#page.quiet #voice{flex:0 0 1px;min-height:0;opacity:0;pointer-events:none}
@media (orientation: landscape){#page{flex-direction:row}#voice{flex:0 0 36%;min-height:0;height:100%}#text{height:100%}}
</style>
</head>
<body>
<div id="page">
  <iframe id="text" title="the article" src="/reader?phone=1"></iframe>
  <iframe id="voice" title="voice and microphone" allow="microphone; autoplay" src="/speaker"></iframe>
</div>
<script>
// pass the speaker's options on (?palette=..., ?listen=0, ?sens=...)
var q = location.search;
if (q) document.getElementById("voice").src = "/speaker" + q;
// The companion changes presentation when asked; no reader control panel.
function presentation(p) {
  document.getElementById('page').classList.toggle('quiet', !!p.folded);
  document.getElementById('text').contentWindow.postMessage({type:'reading-preferences',font:p.font||18,theme:p.theme||'light'},location.origin);
}
function syncPresentation(){
  fetch('/api/screen').then(function(r){return r.json()}).then(function(r){presentation(r.preferences||{})}).catch(function(){}).finally(function(){setTimeout(syncPresentation,2000)});
}
syncPresentation();
</script>
</body></html>
