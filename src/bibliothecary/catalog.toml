# The library's own books: public-domain books the librarian can fetch for you.
#
#   biblio book catalog            the list          (Telegram: /library)
#   biblio book get darwin-emotions                  (Telegram: /get darwin-emotions)
#
# Nothing here is stored in this repository except the one sample book. Each entry says where the
# book is fetched from, and only three sources are used, because their texts are clean to reuse:
#
#   standardebooks  Standard Ebooks: carefully produced; its own work is dedicated to the public
#                   domain (CC0), the texts are public domain in the United States.
#   gutenberg       Project Gutenberg: public-domain texts. "Project Gutenberg" is a trademark, so
#                   its header and licence are left out when the book is shelved.
#   wikisource      Wikisource: public-domain texts transcribed by volunteers.
#
# Every book here is in the public domain in the United States, and its author (and translator)
# died more than 70 years ago, so it is free in the countries that count life + 70 or life + 50
# too. Modern translations and annotated editions are left out: they have copyrights of their own.
#
# "mode" is how the librarian suggests reading it: text (读原文), digest (拆书), excerpts (精华原文).
# Your own additions go in ~/Bibliothecary/catalog.toml, in the same form; an entry with the same
# id replaces this one.

