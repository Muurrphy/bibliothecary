[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-lipsync"
version = "0.1.0"
description = "Real-time, muscle-aware lip sync for robots and constrained displays."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Muurrphy"}]
keywords = ["lip-sync", "robotics", "viseme", "speech", "animation", "esp32"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = []

[project.optional-dependencies]
english = ["cmudict>=1.0.32"]
mandarin = ["pypinyin>=0.55"]
multilingual = ["cmudict>=1.0.32", "pypinyin>=0.55"]
elevenlabs = ["requests>=2.32", "cmudict>=1.0.32"]
serial = ["pyserial>=3.5"]
dev = ["pytest>=8.3", "ruff>=0.9", "jsonschema>=4.23", "pypinyin>=0.55"]

[project.urls]
Homepage = "https://github.com/Muurrphy/robot-lipsync"
Repository = "https://github.com/Muurrphy/robot-lipsync"
Issues = "https://github.com/Muurrphy/robot-lipsync/issues"

[project.scripts]
robot-lipsync = "robot_lipsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_lipsync = ["data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
